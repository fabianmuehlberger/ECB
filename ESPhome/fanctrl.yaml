# Fan Controller: Four PWM fan outputs with shared PI temperature control.
# Sensors: Dallas 1-Wire, AHT20, ESP32 internal.
# All fans share one target temperature and one sensor source selector.
# Ver 5.0 -- Unified safety override, stall detection, on-boot fan burst.
#
# Safety policy: on overtemp, sensor failure, or all-NaN, ALL fans are forced
# to 100% regardless of auto/manual mode. Cleared with hysteresis.
#
# To scan Dallas 1-Wire addresses, temporarily set logger level to DEBUG.

substitutions:
  devicename: fanctrl
  friendlyname: Fan Controller
  fdevicename: ""

  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # PI controller tuning
  p_gain: "20"
  i_gain: "0.03"

  # Safety threshold -- alarm triggers if ANY sensor exceeds this
  alarm_temp: "50"
  # Degrees below alarm_temp before the safety override clears
  alarm_hysteresis: "3"

  # Dallas 1-Wire address (scan with logger level DEBUG)
  dallasaddress1: "0xacc5035009646128"

  # 4-pin PWM fan spec frequency
  pwm_freq: "25600Hz"


# ─── Core ────────────────────────────────────────────────────────────────────

esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  min_version: "2024.11.0"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(pi_integral) = 0.0f;
          id(safety_override) = false;
          id(overtemp_ticks) = 0;
          id(stall_count_1) = 0;
          id(stall_count_2) = 0;
          id(stall_count_3) = 0;
          id(stall_count_4) = 0;
      - fan.turn_on:
          id: fan1_speed
          speed: 100
      - fan.turn_on:
          id: fan2_speed
          speed: 100
      - fan.turn_on:
          id: fan3_speed
          speed: 100
      - fan.turn_on:
          id: fan4_speed
          speed: 100

esp32:
  board: wemos_d1_mini32
  variant: esp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_REV_MIN_3_1: "y"

preferences:
  flash_write_interval: 10min


# ─── Network ─────────────────────────────────────────────────────────────────

wifi:
  ssid: ${ssid}
  password: ${password}
  ap:
    ssid: ${fdevicename}Fallback Hotspot
    password: !secret ap_password
    manual_ip:
      static_ip: 10.1.10.2
      gateway: 10.1.10.2
      subnet: 255.255.255.0

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

web_server:
  port: 80
  version: 3
  local: true
  log: true
  auth:
    username: !secret web_username
    password: !secret web_password

time:
  - platform: sntp
    id: current_time


# ─── Logging & Diagnostics ──────────────────────────────────────────────────

logger:
  level: WARN
  logs:
    fanctrl: WARN
    fan: WARN

debug:
  update_interval: 120s


# ─── Globals ─────────────────────────────────────────────────────────────────

globals:
  - id: pi_integral
    type: float
    restore_value: no
    initial_value: "0"
  - id: safety_override
    type: bool
    restore_value: no
    initial_value: "false"
  - id: overtemp_ticks
    type: int
    restore_value: no
    initial_value: "0"
  - id: stall_count_1
    type: int
    restore_value: no
    initial_value: "0"
  - id: stall_count_2
    type: int
    restore_value: no
    initial_value: "0"
  - id: stall_count_3
    type: int
    restore_value: no
    initial_value: "0"
  - id: stall_count_4
    type: int
    restore_value: no
    initial_value: "0"
  - id: alarm_reason
    type: std::string
    restore_value: no
    initial_value: '"none"'


# ─── User Controls ──────────────────────────────────────────────────────────

number:
  - platform: template
    id: set_target_temp
    name: ${fdevicename}Fan Target
    optimistic: true
    min_value: 20
    max_value: 40
    initial_value: "25"
    step: 1
    restore_value: true
    icon: mdi:temperature-celsius
    on_value:
      then:
        - lambda: 'global_preferences->sync();'

  - platform: template
    id: set_alarm_temp
    name: ${fdevicename}Alarm Threshold
    optimistic: true
    min_value: 20
    max_value: 70
    initial_value: ${alarm_temp}
    step: 1
    restore_value: true
    entity_category: config
    icon: mdi:thermometer-alert
    on_value:
      then:
        - lambda: 'global_preferences->sync();'

select:
  - platform: template
    name: ${fdevicename}Temperature Source
    id: fan_temp_source
    icon: mdi:thermometer-check
    optimistic: true
    restore_value: true
    options:
      - Dallas_1
      - ESP32_Internal
      - AHT20T
    initial_option: Dallas_1
    on_value:
      then:
        - globals.set:
            id: pi_integral
            value: "0"
        - lambda: 'global_preferences->sync();'

switch:
  - platform: restart
    name: ${fdevicename}Restart
    entity_category: config
    icon: mdi:restart

  - platform: gpio
    name: ${fdevicename}Relay 0
    pin: GPIO18
    id: relay_0
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:power

  - platform: template
    id: auto_fan1
    name: ${fdevicename}Fan 1 Auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    icon: mdi:fan-auto
    turn_off_action:
      then:
        # Set speed to minimum then turn off to ensure PWM goes to zero
        - fan.turn_on:
            id: fan1_speed
            speed: 1
        - fan.turn_off:
            id: fan1_speed

  - platform: template
    id: auto_fan2
    name: ${fdevicename}Fan 2 Auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    icon: mdi:fan-auto
    turn_off_action:
      then:
        - fan.turn_on:
            id: fan2_speed
            speed: 1
        - fan.turn_off:
            id: fan2_speed

  - platform: template
    id: auto_fan3
    name: ${fdevicename}Fan 3 Auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    icon: mdi:fan-auto
    turn_off_action:
      then:
        - fan.turn_on:
            id: fan3_speed
            speed: 1
        - fan.turn_off:
            id: fan3_speed

  - platform: template
    id: auto_fan4
    name: ${fdevicename}Fan 4 Auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    icon: mdi:fan-auto
    turn_off_action:
      then:
        - fan.turn_on:
            id: fan4_speed
            speed: 1
        - fan.turn_off:
            id: fan4_speed

  - platform: gpio
    id: oc_port
    name: ${fdevicename}OC Port
    restore_mode: ALWAYS_ON
    entity_category: config
    icon: mdi:light-switch
    pin:
      number: GPIO26
      mode:
        output: true
        pullup: true

button:
  - platform: safe_mode
    name: ${fdevicename}Safe Mode
    entity_category: config
    icon: mdi:shield-refresh

  - platform: template
    name: ${fdevicename}Safety Reset
    icon: mdi:shield-off
    on_press:
      then:
        - lambda: |-
            id(safety_override) = false;
            id(overtemp_ticks) = 0;
            id(pi_integral) = 0.0f;
            id(stall_count_1) = 0;
            id(stall_count_2) = 0;
            id(stall_count_3) = 0;
            id(stall_count_4) = 0;
            id(alarm_reason) = "manual_reset";
            id(alarm_reason_text).publish_state("manual_reset");
            ESP_LOGW("fanctrl", "Safety override manually reset");

  - platform: factory_reset
    name: ${fdevicename}Factory Reset
    entity_category: config
    icon: mdi:restart-alert


# ─── Hardware: Buses ─────────────────────────────────────────────────────────

one_wire:
  - platform: gpio
    pin: GPIO27

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz
  - id: bus_b
    sda: GPIO16
    scl: GPIO17
    scan: true
    frequency: 800kHz


# ─── Hardware: PWM Outputs ───────────────────────────────────────────────────

output:
  - platform: ledc
    pin: GPIO13
    id: fan1
    frequency: ${pwm_freq}

  - platform: ledc
    pin: GPIO14
    id: fan2
    frequency: ${pwm_freq}

  - platform: ledc
    pin: GPIO25
    id: fan3
    frequency: ${pwm_freq}

  - platform: ledc
    pin: GPIO32
    id: fan4
    frequency: ${pwm_freq}

  - platform: ledc
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: alarm_led_output


# ─── Alarm LED ───────────────────────────────────────────────────────────────

light:
  - platform: monochromatic
    id: alarm_light
    output: alarm_led_output
    name: ${fdevicename}Alarm Light
    entity_category: config
    icon: mdi:alert
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%


# ─── Fan Entities ────────────────────────────────────────────────────────────

fan:
  - platform: speed
    output: fan1
    id: fan1_speed
    name: ${fdevicename}Fan 1 Speed
    icon: mdi:fan
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: speed
    output: fan2
    id: fan2_speed
    name: ${fdevicename}Fan 2 Speed
    icon: mdi:fan
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: speed
    output: fan3
    id: fan3_speed
    name: ${fdevicename}Fan 3 Speed
    icon: mdi:fan
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: speed
    output: fan4
    id: fan4_speed
    name: ${fdevicename}Fan 4 Speed
    icon: mdi:fan
    restore_mode: RESTORE_DEFAULT_OFF


# ─── Control Loop ────────────────────────────────────────────────────────────

interval:
  - interval: 2s
    startup_delay: 2s
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;

          // ── 1. Read sensors ──
          const float dallas_raw  = id(Dallas_1).raw_state;
          const float dallas_cal  = id(Dallas_1).state;
          const float aht20_raw   = id(AHT20T).raw_state;
          const float aht20_cal   = id(AHT20T).state;
          const float esp32_raw   = id(esp32_internal_temp).raw_state;
          const float esp32_cal   = id(esp32_internal_temp).state;

          const bool dallas_nan = std::isnan(dallas_raw);
          const bool aht20_nan  = std::isnan(aht20_raw);
          const bool esp32_nan  = std::isnan(esp32_raw);
          const bool any_ok     = !dallas_nan || !aht20_nan || !esp32_nan;
          const bool all_nan    = dallas_nan && aht20_nan && esp32_nan;

          const float limit       = id(set_alarm_temp).state;
          const float clear_limit = limit - ${alarm_hysteresis};

          ESP_LOGV("fanctrl", "[%u] SENSORS raw: dallas=%.2f aht20=%.2f esp32=%.2f | nan: d=%d a=%d e=%d all=%d",
                   tick, dallas_raw, aht20_raw, esp32_raw, dallas_nan, aht20_nan, esp32_nan, all_nan);
          ESP_LOGV("fanctrl", "[%u] SENSORS cal: dallas=%.2f aht20=%.2f esp32=%.2f | limit=%.1f clear=%.1f",
                   tick, dallas_cal, aht20_cal, esp32_cal, limit, clear_limit);

          float selected_raw = NAN;
          float actual = NAN;
          const char *src_name = "UNKNOWN";
          auto idx = id(fan_temp_source).active_index();
          if (idx.has_value()) {
            switch (idx.value()) {
              case 0:
                selected_raw = dallas_raw;
                actual       = dallas_cal;
                src_name     = "Dallas_1";
                break;
              case 1:
                selected_raw = esp32_raw;
                actual       = esp32_cal;
                src_name     = "ESP32_Int";
                break;
              case 2:
                selected_raw = aht20_raw;
                actual       = aht20_cal;
                src_name     = "AHT20";
                break;
              default:
                ESP_LOGE("fanctrl", "[%u] Invalid temp source index: %d", tick, idx.value());
                break;
            }
          }
          ESP_LOGV("fanctrl", "[%u] SELECTED src=%s raw=%.2f cal=%.2f", tick, src_name, selected_raw, actual);

          // ── 2. Evaluate safety triggers ──
          bool trigger = false;
          std::string reason;

          bool ot_dallas = !dallas_nan && dallas_cal >= limit;
          bool ot_aht20  = !aht20_nan  && aht20_cal  >= limit;
          bool ot_esp32  = !esp32_nan  && esp32_cal  >= limit;
          bool any_overtemp = ot_dallas || ot_aht20 || ot_esp32;

          if (any_overtemp) {
            id(overtemp_ticks)++;
            ESP_LOGW("fanctrl", "[%u] OVERTEMP tick %d/5 (d=%.1f%s a=%.1f%s e=%.1f%s)",
                     tick, id(overtemp_ticks),
                     dallas_cal, ot_dallas ? "!" : "", aht20_cal, ot_aht20 ? "!" : "",
                     esp32_cal, ot_esp32 ? "!" : "");
            if (id(overtemp_ticks) >= 5) {
              trigger = true;
              reason = "OVERTEMP(";
              if (ot_dallas) reason += "dallas=" + std::to_string(dallas_cal) + " ";
              if (ot_aht20)  reason += "aht20=" + std::to_string(aht20_cal) + " ";
              if (ot_esp32)  reason += "esp32=" + std::to_string(esp32_cal) + " ";
              reason += "limit=" + std::to_string(limit) + ")";
            }
          } else {
            if (id(overtemp_ticks) > 0)
              ESP_LOGW("fanctrl", "[%u] OVERTEMP reset (was %d ticks)", tick, id(overtemp_ticks));
            id(overtemp_ticks) = 0;
          }

          if (std::isnan(selected_raw)) {
            trigger = true;
            std::string nan_reason = "SELECTED_NAN(src=" + std::string(src_name) + ")";
            if (reason.empty()) reason = nan_reason; else reason += " + " + nan_reason;
            ESP_LOGW("fanctrl", "[%u] TRIGGER: selected source %s is NaN", tick, src_name);
          }

          if (all_nan) {
            trigger = true;
            std::string nan_reason = "ALL_SENSORS_NAN";
            if (reason.empty()) reason = nan_reason; else reason += " + " + nan_reason;
            ESP_LOGW("fanctrl", "[%u] TRIGGER: ALL sensors NaN", tick);
          }

          ESP_LOGV("fanctrl", "[%u] SAFETY pre: override=%d trigger=%d overtemp_ticks=%d stall=[%d,%d,%d,%d]",
                   tick, id(safety_override), trigger, id(overtemp_ticks),
                   id(stall_count_1), id(stall_count_2), id(stall_count_3), id(stall_count_4));

          // ── 3. Set/clear safety_override with hysteresis ──
          if (trigger) {
            if (!id(safety_override)) {
              ESP_LOGW("fanctrl", "[%u] >>> SAFETY OVERRIDE ACTIVATED: %s", tick, reason.c_str());
              id(alarm_reason) = reason;
              id(alarm_reason_text).publish_state(reason);
            }
            id(safety_override) = true;
          } else if (id(safety_override)) {
            bool all_clear = any_ok && !std::isnan(selected_raw);
            bool dc = !dallas_nan && dallas_cal >= clear_limit;
            bool ac = !aht20_nan  && aht20_cal  >= clear_limit;
            bool ec = !esp32_nan  && esp32_cal  >= clear_limit;
            if (dc) all_clear = false;
            if (ac) all_clear = false;
            if (ec) all_clear = false;
            bool stall_clear = id(stall_count_1) < 15 && id(stall_count_2) < 15
                            && id(stall_count_3) < 15 && id(stall_count_4) < 15;
            ESP_LOGW("fanctrl", "[%u] CLEAR CHECK: any_ok=%d sel_ok=%d temps_clear=%d(d=%d,a=%d,e=%d) stall_clear=%d",
                     tick, any_ok, !std::isnan(selected_raw), all_clear && !dc && !ac && !ec,
                     !dc, !ac, !ec, stall_clear);
            if (all_clear && stall_clear) {
              id(safety_override) = false;
              id(pi_integral) = 0.0f;
              ESP_LOGW("fanctrl", "[%u] <<< SAFETY OVERRIDE CLEARED (was: %s)", tick, id(alarm_reason).c_str());
              id(alarm_reason) = "none";
              id(alarm_reason_text).publish_state("none");
            }
          }

          // ── 4. Apply fan control ──
          if (id(safety_override)) {
            auto force_max = [](auto *fan) {
              auto call = fan->turn_on();
              call.set_speed(100);
              call.perform();
            };
            force_max(id(fan1_speed));
            force_max(id(fan2_speed));
            force_max(id(fan3_speed));
            force_max(id(fan4_speed));
          } else {
            const bool any_auto = id(auto_fan1).state || id(auto_fan2).state
                               || id(auto_fan3).state || id(auto_fan4).state;
            float speed = 1.0f;

            if (any_auto && !std::isnan(actual)) {
              const float target = id(set_target_temp).state;
              if (!std::isnan(target)) {
                const float error = actual - target;
                float raw_speed = error * ${p_gain} + id(pi_integral) * ${i_gain};
                if (raw_speed > 0.0f && raw_speed < 100.0f) {
                  id(pi_integral) += error;
                  if (id(pi_integral) >  350.0f) id(pi_integral) =  350.0f;
                  if (id(pi_integral) < -350.0f) id(pi_integral) = -350.0f;
                }
                speed = raw_speed;
                if (speed > 100.0f) speed = 100.0f;
                if (speed <   0.0f) speed = 0.0f;

                ESP_LOGV("fanctrl", "[%u] PI: actual=%.2f target=%.1f error=%.2f integral=%.1f speed=%.1f",
                         tick, actual, target, error, id(pi_integral), speed);
              } else {
                speed = 100.0f;
                ESP_LOGW("fanctrl", "[%u] PI: target is NaN, defaulting speed=100", tick);
              }
            }

            static float prev_speed = 0.0f;
            const float max_step = 3.0f;
            float pre_slew = speed;
            if (speed > prev_speed + max_step) speed = prev_speed + max_step;
            if (speed < prev_speed - max_step) speed = prev_speed - max_step;
            if (pre_slew != speed)
              ESP_LOGV("fanctrl", "[%u] SLEW: %.1f -> %.1f (was %.1f)", tick, pre_slew, speed, prev_speed);
            prev_speed = speed;

            const float target = id(set_target_temp).state;
            const bool temp_valid = !std::isnan(actual) && !std::isnan(target);
            const bool too_cold = temp_valid && (actual < target - 2.0f);

            auto apply = [&](auto *fan) {
              if (too_cold && fan->state) {
                auto off = fan->turn_off();
                off.set_speed(1);
                off.perform();
              } else if (!too_cold) {
                auto on = fan->turn_on();
                on.set_speed(std::max(speed, 20.0f));
                on.perform();
              }
            };
            if (id(auto_fan1).state) apply(id(fan1_speed));
            if (id(auto_fan2).state) apply(id(fan2_speed));
            if (id(auto_fan3).state) apply(id(fan3_speed));
            if (id(auto_fan4).state) apply(id(fan4_speed));
          }

          // ── 5. Fan stall detection ──
          bool any_stall = id(stall_count_1) >= 15 || id(stall_count_2) >= 15
                        || id(stall_count_3) >= 15 || id(stall_count_4) >= 15;
          if (!id(safety_override)) {
            auto check_stall = [tick](auto *fan, float rpm, int &counter, const char *name) {
              bool stall_cond = fan->state && fan->speed > 50 && rpm <= 0.0f && !std::isnan(rpm);
              if (stall_cond) {
                counter++;
                ESP_LOGW("fanctrl", "[%u] STALL %s: on=%d spd=%d rpm=%.0f count=%d/15",
                         tick, name, fan->state, fan->speed, rpm, counter);
                if (counter == 15) ESP_LOGW("fanctrl", "[%u] STALL CONFIRMED: %s", tick, name);
                if (counter > 16) counter = 16;
              } else {
                if (counter > 0)
                  ESP_LOGW("fanctrl", "[%u] STALL %s: cleared (on=%d spd=%d rpm=%.0f was=%d)",
                           tick, name, fan->state, fan->speed, rpm, counter);
                counter = 0;
              }
            };
            check_stall(id(fan1_speed), id(fan1_rpm).state, id(stall_count_1), "Fan1");
            check_stall(id(fan2_speed), id(fan2_rpm).state, id(stall_count_2), "Fan2");
            check_stall(id(fan3_speed), id(fan3_rpm).state, id(stall_count_3), "Fan3");
            check_stall(id(fan4_speed), id(fan4_rpm).state, id(stall_count_4), "Fan4");
            any_stall = id(stall_count_1) >= 15 || id(stall_count_2) >= 15
                     || id(stall_count_3) >= 15 || id(stall_count_4) >= 15;
            if (any_stall) {
              std::string stall_reason = "STALL(";
              if (id(stall_count_1) >= 15) stall_reason += "Fan1 ";
              if (id(stall_count_2) >= 15) stall_reason += "Fan2 ";
              if (id(stall_count_3) >= 15) stall_reason += "Fan3 ";
              if (id(stall_count_4) >= 15) stall_reason += "Fan4 ";
              stall_reason += ")";
              ESP_LOGW("fanctrl", "[%u] >>> SAFETY OVERRIDE ACTIVATED: %s", tick, stall_reason.c_str());
              id(alarm_reason) = stall_reason;
              id(alarm_reason_text).publish_state(stall_reason);
              id(safety_override) = true;
            }
          }

          ESP_LOGV("fanctrl", "[%u] RPM: f1=%.0f f2=%.0f f3=%.0f f4=%.0f",
                   tick, id(fan1_rpm).state, id(fan2_rpm).state,
                   id(fan3_rpm).state, id(fan4_rpm).state);

          // ── 6. Alarm LED and binary sensor ──
          static bool alarm_was_active = false;
          bool alarm_active = id(safety_override) || any_stall;
          if (alarm_active != alarm_was_active) {
            ESP_LOGW("fanctrl", "[%u] ALARM %s reason=%s",
                     tick, alarm_active ? "ON" : "OFF", id(alarm_reason).c_str());
            ESP_LOGW("fanctrl", "[%u]   temps: dallas=%.2f aht20=%.2f esp32=%.2f (nan:%d/%d/%d) limit=%.1f",
                     tick, dallas_cal, aht20_cal, esp32_cal, dallas_nan, aht20_nan, esp32_nan, limit);
            ESP_LOGW("fanctrl", "[%u]   rpm: f1=%.0f f2=%.0f f3=%.0f f4=%.0f  stall=[%d,%d,%d,%d]",
                     tick, id(fan1_rpm).state, id(fan2_rpm).state,
                     id(fan3_rpm).state, id(fan4_rpm).state,
                     id(stall_count_1), id(stall_count_2), id(stall_count_3), id(stall_count_4));
          }
          if (alarm_active && !alarm_was_active) {
            auto call = id(alarm_light).turn_on();
            call.set_effect("Fast Pulse");
            call.perform();
            id(alarm_sen).publish_state(true);
          } else if (!alarm_active && alarm_was_active) {
            auto call = id(alarm_light).turn_off();
            call.perform();
            id(alarm_sen).publish_state(false);
          }
          alarm_was_active = alarm_active;


# ─── Temperature Sensors ─────────────────────────────────────────────────────

sensor:
  - platform: dallas_temp
    address: ${dallasaddress1}
    id: Dallas_1
    name: ${fdevicename}Dallas Temp 1
    update_interval: 2s
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:thermometer
    filters:
      - filter_out: NaN

  - platform: aht10
    i2c_id: bus_b
    address: 0x38
    variant: AHT20
    update_interval: 2s
    temperature:
      id: AHT20T
      name: ${fdevicename}AHT20 Temp
      device_class: temperature
      icon: mdi:thermometer
      filters:
        - filter_out: NaN
        - offset: -6.0
    humidity:
      name: ${fdevicename}AHT20 Humidity
      id: AHT20H
      device_class: humidity
      icon: mdi:water-percent
      filters:
        - filter_out: NaN

  - platform: internal_temperature
    id: esp32_internal_temp
    name: ${fdevicename}ESP32 Temp
    unit_of_measurement: "°C"
    entity_category: diagnostic
    icon: mdi:thermometer
    update_interval: 30s
    web_server:
      sorting_weight: 7


  # ─── Fan RPM Monitors ────────────────────────────────────────────────────

  - platform: pulse_counter
    pin: GPIO33
    id: fan1_rpm
    unit_of_measurement: rpm
    name: ${fdevicename}Fan 1 RPM
    device_class: speed
    icon: mdi:fan
    update_interval: 5s
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin: GPIO34
    id: fan2_rpm
    unit_of_measurement: rpm
    name: ${fdevicename}Fan 2 RPM
    device_class: speed
    icon: mdi:fan
    update_interval: 5s
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin: GPIO35
    id: fan3_rpm
    unit_of_measurement: rpm
    name: ${fdevicename}Fan 3 RPM
    device_class: speed
    icon: mdi:fan
    update_interval: 5s
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin: GPIO39
    id: fan4_rpm
    unit_of_measurement: rpm
    name: ${fdevicename}Fan 4 RPM
    device_class: speed
    icon: mdi:fan
    update_interval: 5s
    filters:
      - multiply: 0.5


  # ─── Network & System Diagnostics ────────────────────────────────────────

  - platform: wifi_signal
    name: ${fdevicename}WiFi Signal
    entity_category: diagnostic
    icon: mdi:wifi
    update_interval: 30s
    web_server:
      sorting_weight: 4

  - platform: uptime
    name: ${fdevicename}Uptime
    entity_category: diagnostic
    icon: mdi:timer-sync-outline
    update_interval: 60s
    web_server:
      sorting_weight: 6

  - platform: debug
    free:
      name: ${fdevicename}Heap Free
      entity_category: diagnostic
      web_server:
        sorting_weight: 9
    block:
      name: ${fdevicename}Heap Max Block
      entity_category: diagnostic
      web_server:
        sorting_weight: 10
    loop_time:
      name: ${fdevicename}Loop Time
      entity_category: diagnostic
      web_server:
        sorting_weight: 8


# ─── Text Sensors ────────────────────────────────────────────────────────────

text_sensor:
  - platform: template
    id: alarm_reason_text
    name: ${fdevicename}Alarm Reason
    icon: mdi:alert-circle-outline
    web_server:
      sorting_weight: -1

  - platform: template
    name: ${fdevicename}Device
    entity_category: diagnostic
    icon: mdi:devices
    lambda: 'return {"ESP32 Control Board (IDF)"};'
    web_server:
      sorting_weight: 14

  - platform: version
    name: ${fdevicename}ESPHome Version
    entity_category: diagnostic
    web_server:
      sorting_weight: 15

  - platform: wifi_info
    ip_address:
      name: ${fdevicename}IP Address
      entity_category: diagnostic
      icon: mdi:ip
      web_server:
        sorting_weight: 0
    ssid:
      name: ${fdevicename}Connected SSID
      entity_category: diagnostic
      icon: mdi:wifi
      web_server:
        sorting_weight: 2
    bssid:
      name: ${fdevicename}Connected BSSID
      entity_category: diagnostic
      icon: mdi:wifi
      web_server:
        sorting_weight: 3
    mac_address:
      name: ${fdevicename}MAC Address
      entity_category: diagnostic
      icon: mdi:wifi
      web_server:
        sorting_weight: 1

  - platform: debug
    reset_reason:
      name: ${fdevicename}Reset Reason
      entity_category: diagnostic


# ─── Binary Sensors ──────────────────────────────────────────────────────────

binary_sensor:
  - platform: status
    name: ${fdevicename}Status
    entity_category: diagnostic
    icon: mdi:lan-connect

  - platform: template
    id: alarm_sen
    name: ${fdevicename}Alarm
    icon: mdi:fire-alert
